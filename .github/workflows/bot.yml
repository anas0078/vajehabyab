name: Telegram Bot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install python-telegram-bot==20.7
      - name: Run bot
        run: timeout 18000 python bot.py || true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
